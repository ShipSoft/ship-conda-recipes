name: Channel drift

# Detect ship-channel packages whose conda-forge pins have fallen behind the
# current conda-forge release (a stale run_exports bound). Unlike the binary
# dev-build signal — which stays green because a free `*` solve co-selects the
# older, mutually-compatible builds — this compares each published build's pins
# against conda-forge and flags what needs rebuilding. On drift it bumps the
# affected recipes' build.number and opens/updates a rebuild PR; merging it
# rebuilds and re-uploads via build.yml.
#
# Pins we hold ourselves in a recipe's variants.yaml (root_base) are exempt: a
# rebuild reproduces them unchanged, so they get a separate PR that advances
# the pin across every recipe in lockstep instead.

on:
  schedule:
    - cron: '0 4 * * 1'  # Mondays, 04:00 UTC (ahead of the channel snapshot)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize scheduled and manual runs so overlapping invocations queue rather
# than race on the shared channel-drift branch / PR.
concurrency:
  group: channel-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    # Two independent legs rather than two create-pull-request calls in one
    # job: each gets its own clean checkout, so neither can commit the other's
    # edits. They target disjoint branches and paths.
    #   recipes  — build.number bumps; a routine refresh, usually safe to merge.
    #   variants — advances a pin we hold (root_base), i.e. a real ROOT upgrade
    #              that rebuilds the stack and deserves review on its own.
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: recipes
            flag: '--bump-recipes'
            branch: channel-drift
            paths: recipes/**/recipe.yaml
            commit: 'chore: rebuild packages behind conda-forge'
          - leg: variants
            flag: '--bump-variants'
            branch: variant-drift
            paths: recipes/**/variants.yaml
            commit: 'chore: bump variant pins behind conda-forge'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pixi (drift env — provides py-rattler)
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: drift
          locked: true

      - name: Test the drift script
        run: pixi run -e drift test-drift

      - name: Detect drift and apply ${{ matrix.leg }} bumps
        id: drift
        run: |
          set -euo pipefail
          pixi run -e drift check-drift ${{ matrix.flag }} --pr-body pr-body.md
          {
            echo 'body<<PRBODY'
            cat pr-body.md
            echo 'PRBODY'
          } >> "$GITHUB_OUTPUT"
          rm -f pr-body.md

      # No-ops when the leg changed nothing, so a quiet week opens no PR.
      - name: Open / update ${{ matrix.leg }} PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ matrix.commit }}
          title: ${{ matrix.commit }}
          body: ${{ steps.drift.outputs.body }}
          branch: ${{ matrix.branch }}
          base: main
          labels: drift
          delete-branch: true
          add-paths: ${{ matrix.paths }}
