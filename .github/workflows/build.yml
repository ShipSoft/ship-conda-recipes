name: Build and upload conda packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      recipe:
        description: Single recipe directory (e.g. random123); empty = all
        type: string
        default: ''
      force:
        description: Drop --skip-existing (use to rebuild over the same version)
        type: boolean
        default: false

jobs:
  build:
    uses: ShipSoft/.github/.github/workflows/rattler-build-and-upload.yml@main
    # Trusted publishing to prefix.dev: no API key is passed, the upload
    # uses this workflow's OIDC token.
    permissions:
      contents: read
      id-token: write
    with:
      recipe: ${{ inputs.recipe || '' }}
      force: ${{ inputs.force || false }}
      # Manual dispatches on main upload too, so a recipe can be released on
      # its own (e.g. a dependency before the consumers that pin it).
      upload: >-
        ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && github.ref == 'refs/heads/main' }}
      channel-name: ship-experiment/stable
      extra-channels: |
        https://prefix.dev/ship-experiment/stable
        conda-forge
      variant-config: global-variants.yaml

  all-checks:
    name: All checks passed
    if: always()
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Check status of all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
