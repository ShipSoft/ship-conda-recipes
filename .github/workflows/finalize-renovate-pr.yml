name: Finalize renovate recipe PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'recipes/**/recipe.yaml'

permissions:
  contents: write
  pull-requests: write

# A Renovate force-push while this job runs would make the push below fail
# non-fast-forward; the newer run supersedes it.
concurrency:
  group: finalize-renovate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          locked: true

      - name: Refresh sha256 for changed recipes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git diff --name-only "origin/${BASE_REF}...HEAD" \
              -- 'recipes/*/recipe.yaml'
          )
          if [ ${#changed[@]} -eq 0 ]; then
            echo "No changed recipe.yaml files; nothing to do."
            exit 0
          fi
          printf 'Changed recipes:\n%s\n' "${changed[@]}"
          pixi run ci/finalize-recipe-bump.sh "${changed[@]}"

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Recipes already in sync; no follow-up commit needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recipes
          git commit -m 'chore(recipe): refresh sha256 after version bump'
          git push
