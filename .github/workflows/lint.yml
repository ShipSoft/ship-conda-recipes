name: Lint

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight PR runs on a new push; never cancel main or merge-queue runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    # Lets the shared workflow comment on the PR when hooks fail.
    permissions:
      contents: read
      pull-requests: write
    uses: ShipSoft/.github/.github/workflows/prek.yml@main
  commit-check:
    permissions:
      contents: read
      pull-requests: write
    uses: ShipSoft/.github/.github/workflows/commit-check.yml@main

  all-checks:
    name: Lint passed
    if: always()
    runs-on: ubuntu-latest
    needs: [prek, commit-check]
    steps:
      - name: Check status of all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
