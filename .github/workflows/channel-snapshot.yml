name: Channel snapshot

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays, 06:00 UTC
  workflow_dispatch:

# Writes go through the app token below; GITHUB_TOKEN only reads.
permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # An app token, unlike GITHUB_TOKEN, lets the PR trigger the
      # build and lint workflows.
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7

      - name: Generate channel snapshot
        run: |
          set -euo pipefail
          channel_url="https://prefix.dev/ship-experiment/stable"
          {
            echo "# prefix.dev/ship-experiment/stable channel snapshot"
            for subdir in linux-64 noarch; do
              repodata=$(curl -fsSL --retry 3 "${channel_url}/${subdir}/repodata.json")
              count=$(echo "$repodata" | jq '."packages.conda" | length')
              [ "$count" = "0" ] && continue
              echo
              echo "## ${subdir}"
              echo
              echo "| Package | Version | Build | Build number | Uploaded |"
              echo "|---------|---------|-------|--------------|----------|"
              echo "$repodata" | jq -r '
                ."packages.conda"
                | to_entries
                | map(.value)
                | sort_by(.name, .version, (.build_number // 0))
                | .[]
                | ("| \(.name) | \(.version) | `\(.build)` | "
                   + "\(.build_number // 0) | "
                   + "\(((.timestamp // 0) / 1000) | strftime("%Y-%m-%d")) |")
              '
            done
          } > channel-snapshot.md

      - name: Open / update snapshot PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore(snapshot): refresh prefix.dev/ship-experiment/stable channel snapshot'
          title: 'chore: refresh channel snapshot'
          body: |
            Weekly snapshot of the
            [prefix.dev/ship-experiment/stable](https://prefix.dev/channels/@ship-experiment/stable) channel.

            Auto-generated; merge to keep `channel-snapshot.md` current. The diff
            shows new builds, version bumps, and any accidental publishes since
            the last snapshot.
          branch: channel-snapshot
          base: main
          labels: snapshot
          delete-branch: true
          add-paths: channel-snapshot.md
