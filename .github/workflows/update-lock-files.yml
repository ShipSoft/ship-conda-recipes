name: Update lock files

on:
  workflow_dispatch:
  schedule:
    - cron: 0 5 1 * *

jobs:
  pixi-update:
    permissions:
      contents: write
      pull-requests: write
    uses: ShipSoft/.github/.github/workflows/pixi-lock-update.yml@main
    with:
      base: main
    secrets:
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
