# Variant pins applied to every build in this repository, on top of each
# recipe's own variants.yaml (keys here win; the recipe files don't set
# these). Passed with --variant-config / -m by build.yml, nightly-main.yml
# and the pixi build tasks.
#
# Compiler versions follow conda-forge's global pinning
# (conda-forge-pinning-feedstock, recipe/conda_build_config.yaml). Without
# them rattler-build takes the newest compiler, and packages built with a
# newer GCC than their consumers can fail to link: std::format code built
# with GCC 16 leaves symbols that a GCC 15 link can't resolve. Move these
# together with conda-forge.
c_compiler_version:
  - "15"
cxx_compiler_version:
  - "15"

# Geant4 is pinned so every package here is built against the same release,
# and so that a Geant4 upgrade is a decision rather than a side effect of a
# rebuild. Recipes list geant4 in host: without a version; this variant
# turns that into 11.4.3.*, and geant4's run_exports carry the pin into each
# package's run requirements. Before moving it, check that conda-forge has
# geant4-vmc, vgm and geomodel builds for the new version.
geant4:
  - "11.4.3"
