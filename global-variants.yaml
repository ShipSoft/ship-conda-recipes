# Variant pins applied to every build in this repository, on top of each
# recipe's own variants.yaml (keys here win; the recipe files don't set
# these). Passed with --variant-config / -m by build.yml, nightly-main.yml
# and the pixi build tasks.
#
# Compiler versions follow conda-forge's global pinning
# (conda-forge-pinning-feedstock, recipe/conda_build_config.yaml). Without
# them rattler-build takes the newest compiler, and packages built with a
# newer GCC than their consumers can fail to link: std::format code built
# with GCC 16 leaves symbols that a GCC 15 link can't resolve. Move these
# together with conda-forge.
#
# On macOS, conda-forge's root_base requires the libc++ headers of the clang
# cling was built with (libcxx-devel 20), so any environment that combines
# ROOT and a compiler gets clang 20; build with it too, as root-feedstock and
# phlex-feedstock do. Move it when root_base does.
c_compiler_version:
  - if: linux
    then: "15"
  - if: osx
    then: "20"
cxx_compiler_version:
  - if: linux
    then: "15"
  - if: osx
    then: "20"
# macOS only: the recipes request the sysroot explicitly on Linux and
# ${{ stdlib('c') }} on macOS. 13.3 because std::format of floating-point
# values needs std::to_chars, which libc++ only provides from macOS 13.3 (see
# https://conda-forge.org/docs/maintainer/knowledge_base#newer-c-features-with-old-sdk).
c_stdlib:
  - if: osx
    then: macosx_deployment_target
c_stdlib_version:
  - if: osx
    then: "13.3"
