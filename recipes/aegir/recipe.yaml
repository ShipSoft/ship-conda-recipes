context:
  version: "0.4.0"

package:
  name: aegir
  version: ${{ version }}

source:
  url: https://github.com/ShipSoft/aegir/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7d9274e33fec96a10baa0bbfabfd9b92b332cf8660919d58c3c00678f3d044af

build:
  number: 1
  skip:
    - win
  script: build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - sysroot_linux-64 2.17.*
    - cmake
    - make
  host:
    # 0.4.x still uses the camelCase field names that data-model 0.6
    # renamed, so it cannot build against 0.6.
    - shipdatamodel >=0.5,<0.6
    - phlex >=0.4.1
    - shipgeometryservice >=0.3
    - field-service-core >=0.2
    - field-service-g4 >=0.2
    # SHiPFieldService::MapIO, used by field_map_provider.
    - field-service-mapio >=0.2
    - root_base >=6.40
    # phlex/shipdatamodel are C++23; pin the matching ROOT variant so aegir
    # and phlex stay co-installable (an unconstrained solve drifts down to
    # the C++20 ROOT build).
    - root_cxx_standard ==23
    - geant4
    # geant4 Config.cmake calls find_dependency() on all three; see
    # "Known upstream workarounds" in the README.
    - expat
    - zlib
    - freetype
    - pythia8 >=8.312
    - random123
    # SHiP::random::PhiloxRng, the generators' per-event RNG.
    - ship-random >=0.2
    - libboost-devel
    - tbb-devel
    - spdlog
    - fmt
    - mp-units
    - ms-gsl
    # GeoModel consumers need both in host — see "Known upstream
    # workarounds" in the README for the remove-when conditions.
    - eigen-abi-devel
    - nlohmann_json
tests:
  - script:
      - test -f $PREFIX/lib/libparticle_gun_source.so
      - test -f $PREFIX/lib/libpythia8_source.so
      - test -f $PREFIX/lib/libfixed_target_source.so
      - test -f $PREFIX/lib/libfile_source.so
      - test -f $PREFIX/lib/libgenie_reader_source.so
      - test -f $PREFIX/lib/libgeometry_builtin_provider.so
      - test -f $PREFIX/lib/libgeometry_gdml_provider.so
      - test -f $PREFIX/lib/libgeometry_geomodel_provider.so
      - test -f $PREFIX/lib/libfield_map_provider.so
      - test -f $PREFIX/lib/libfield_null_provider.so
      - test -f $PREFIX/lib/libgeant4_module.so
      - test -f $PREFIX/lib/libsim_output_module.so
      - test -f $PREFIX/bin/pythia8_benchmark
      - test -d $PREFIX/share/aegir/workflows
      - test -f $PREFIX/include/aegir/mc_particle_source.hpp
      - test -f $PREFIX/lib/cmake/aegir/aegirConfig.cmake

about:
  homepage: https://github.com/ShipSoft/aegir
  repository: https://github.com/ShipSoft/aegir
  summary: Phlex-based simulation framework for the SHiP experiment
  description: |
    aegir is the next-generation simulation framework for the SHiP
    experiment, built on top of the Phlex parallel data-processing
    toolkit and the SHiP event data model. It composes pluggable
    sources (particle gun, Pythia8, fixed-target), geometry providers
    (built-in, GDML, GeoModel via SHiPGeometryService), a Geant4
    transform module, and an RNTuple-based output observer into a
    multi-threaded simulation workflow.
  license: LGPL-3.0-or-later
  license_file: LICENSES/LGPL-3.0-or-later.txt

extra:
  recipe-maintainers:
    - olantwin
