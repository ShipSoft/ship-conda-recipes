context:
  # Shared-library suffix, for the tests.
  shlib_ext: ${{ "dylib" if osx else "so" }}
  version: "0.6.0"

package:
  name: shipdatamodel
  version: ${{ version }}

source:
  url: https://github.com/ShipSoft/data-model/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 2c5a6af1efc291ec48ace3f262bd20225a7c056941b7723911649b500354113d

build:
  number: 1
  skip:
    - win
  script: build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - if: linux
      then: sysroot_${{ target_platform }} 2.17.*
      else: ${{ stdlib('c') }}
    - cmake
    - make
  host:
    - root_base
    - root_cxx_standard
    # 0.2.0 adds SHiPUnits: CMakeLists.txt does find_package(mp-units 2.5
    # CONFIG REQUIRED) and SHiPDataModelConfig.cmake.in does
    # find_dependency(mp-units 2.5 CONFIG). mp-units' run_exports pins it
    # into run for consumers of the installed headers.
    - mp-units
  run_exports:
    - ${{ pin_subpackage('shipdatamodel', upper_bound='x.x') }}

tests:
  - script:
      - test -f $PREFIX/lib/libSHiPDataModel.${{ shlib_ext }}
      - test -f $PREFIX/lib/libSHiPDataModel.rootmap
      - test -f $PREFIX/lib/libSHiPDataModel_rdict.pcm
      - test -f $PREFIX/lib/cmake/SHiPDataModel/SHiPDataModelConfig.cmake
      - test -f $PREFIX/include/SHiP/MCParticle.hpp
      # 0.6.0 de-stuttered the exported target names. The library file names are
      # deliberately unchanged, so the tests above would not notice if the
      # export names regressed.
      - grep -q "SHiP::DataModel" $PREFIX/lib/cmake/SHiPDataModel/SHiPDataModelTargets.cmake
      - grep -q "SHiP::Units" $PREFIX/lib/cmake/SHiPDataModel/SHiPDataModelTargets.cmake

about:
  homepage: https://github.com/ShipSoft/data-model
  repository: https://github.com/ShipSoft/data-model
  summary: Event data model for the SHiP experiment
  description: |
    SHiPDataModel provides the C++ event data classes for the SHiP
    experiment, with ROOT dictionary support for I/O via TTree and
    RNTuple. The classes (MCParticle, SimHit, SimParticle, SimResult)
    are plain structs with default member initialisers and are
    consumed by downstream SHiP simulation, digitisation and
    reconstruction packages.
  license: LGPL-3.0-or-later
  license_file: LICENSES/LGPL-3.0-or-later.txt

extra:
  recipe-maintainers:
    - olantwin
