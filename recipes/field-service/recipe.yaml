context:
  version: "0.2.0"

recipe:
  name: field-service
  version: ${{ version }}

source:
  - url: https://github.com/ShipSoft/field_service/archive/refs/tags/v${{ version }}.tar.gz
    sha256: af847bfc9bb2b2f2cf655ddf0924a960d896e4dc9ccc00aa84ca30400a401cf8
  # covfie is FetchContent'd by upstream CMake; vendor it so the build
  # stays offline. Pinned to the same tag the CMakeLists.txt uses.
  - url: https://github.com/acts-project/covfie/archive/refs/tags/v0.15.6.tar.gz
    sha256: ed22408f981692398408ffe04ff8e6230c022288552a83dbc2ad34b96003a84e
    target_directory: covfie_src

build:
  number: 0

outputs:
  - staging:
      name: field-service-build
    build:
      script: |
        cmake ${CMAKE_ARGS} -S ${SRC_DIR} -B build \
            -DCMAKE_CXX_STANDARD=${{ root_cxx_standard }} \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_G4_ADAPTER=ON \
            -DBUILD_TOOLS=ON \
            -DBUILD_TESTING=OFF \
            -DFETCHCONTENT_SOURCE_DIR_COVFIE=${SRC_DIR}/covfie_src
        cmake --build build --parallel ${CPU_COUNT}
        cmake --install build
    requirements:
      build:
      - ${{ compiler('cxx') }}
      - sysroot_linux-64 2.17.*
      - cmake
      - make
      host:
      - mp-units
      # SHiP/Units.hpp (SHiP::SHiPUnits). Pin <1 to exclude the legacy
      # 26.06.0 builds still on the ship channel.
      - shipdatamodel <1
      - geant4
      # geant4 Config.cmake calls find_dependency() on all three; see
      # "Known upstream workarounds" in the README.
      - expat
      - zlib
      - freetype
      - root_base
      - root_cxx_standard

  - package:
      name: field-service-core
    inherit: field-service-build
    build:
      files:
        - lib/libSHiPFieldService.so*
        - include/FieldService/IFieldSource.h
        - include/FieldService/CovfieFieldSource.h
        - include/FieldService/FieldMap.h
        - lib/cmake/SHiPFieldService/SHiPFieldServiceConfig.cmake
        - lib/cmake/SHiPFieldService/SHiPFieldServiceConfigVersion.cmake
        - lib/cmake/SHiPFieldService/SHiPFieldServiceTargets.cmake
        - lib/cmake/SHiPFieldService/SHiPFieldServiceTargets-*.cmake
    requirements:
      run:
        # find_dependency(mp-units) and find_dependency(SHiPDataModel) in
        # SHiPFieldServiceConfig.cmake — needed in consumers' host env at
        # configure time, which requires listing them here rather than
        # relying on their run_exports alone.
        - mp-units
        - shipdatamodel <1
      run_exports:
        - ${{ pin_subpackage('field-service-core', upper_bound='x.x') }}
      # The shared staging host pulls geant4 (+ its expat / zlib / freetype
      # Config deps) and root_base for the g4-adapter and tools outputs; the
      # core library links none of them, so suppress their run_exports here.
      # mp-units run_export is kept (PUBLIC link).
      ignore_run_exports:
        from_package:
          - geant4
          - expat
          - zlib
          - freetype
          - root_base
          - root_cxx_standard
    tests:
      - script:
          - test -f $PREFIX/lib/libSHiPFieldService.so
          - test -f $PREFIX/include/FieldService/IFieldSource.h
          - test -f $PREFIX/include/FieldService/CovfieFieldSource.h
          - test -f $PREFIX/include/FieldService/FieldMap.h
          - test -f $PREFIX/lib/cmake/SHiPFieldService/SHiPFieldServiceConfig.cmake
          - test -f $PREFIX/lib/cmake/SHiPFieldService/SHiPFieldServiceTargets.cmake

  - package:
      name: field-service-mapio
    inherit: field-service-build
    build:
      files:
        - lib/libSHiPFieldServiceMapIO.so*
        - include/FieldService/FieldMapIO.h
        - lib/cmake/SHiPFieldService/SHiPFieldServiceMapIOTargets.cmake
        - lib/cmake/SHiPFieldService/SHiPFieldServiceMapIOTargets-*.cmake
    requirements:
      run:
        - ${{ pin_subpackage('field-service-core', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('field-service-mapio', upper_bound='x.x') }}
      # Links ROOT (kept via root_base's run_exports), not Geant4 or its
      # Config deps.
      ignore_run_exports:
        from_package:
          - geant4
          - expat
          - zlib
          - freetype
    tests:
      - script:
          - test -f $PREFIX/lib/libSHiPFieldServiceMapIO.so
          - test -f $PREFIX/include/FieldService/FieldMapIO.h
          - test -f $PREFIX/lib/cmake/SHiPFieldService/SHiPFieldServiceMapIOTargets.cmake

  - package:
      name: field-service-g4
    inherit: field-service-build
    build:
      files:
        - include/FieldService/G4MagFieldAdapter.h
        - lib/cmake/SHiPFieldService/SHiPFieldServiceG4AdapterTargets.cmake
        - lib/cmake/SHiPFieldService/SHiPFieldServiceG4AdapterTargets-*.cmake
    requirements:
      run:
        - ${{ pin_subpackage('field-service-core', exact=True) }}
        # find_dependency(Geant4) is invoked from Config.cmake whenever the
        # G4AdapterTargets file is present in the prefix.
        - geant4
        # ... which in turn calls find_dependency() on all three; see
        # "Known upstream workarounds" in the README.
        - expat
        - zlib
        - freetype
      run_exports:
        - ${{ pin_subpackage('field-service-g4', upper_bound='x.x') }}
      # ROOT is staged for the mapio and tools outputs, not the g4 adapter.
      ignore_run_exports:
        from_package:
          - root_base
          - root_cxx_standard
    tests:
      - script:
          - test -f $PREFIX/include/FieldService/G4MagFieldAdapter.h
          - test -f $PREFIX/lib/cmake/SHiPFieldService/SHiPFieldServiceG4AdapterTargets.cmake

  - package:
      name: field-service-tools
    inherit: field-service-build
    build:
      files:
        - bin/fieldmap_dump
        - bin/generate_constant_fieldmap
        - bin/fairship_to_fieldmap
        - bin/plot_field_map
    requirements:
      run:
        - ${{ pin_subpackage('field-service-mapio', exact=True) }}
      # Tools don't link Geant4 or its Config deps; mp-units is pulled in
      # transitively via the core sub-package, not directly by these binaries.
      ignore_run_exports:
        from_package:
          - geant4
          - expat
          - zlib
          - freetype
          - mp-units
    tests:
      - script:
          - test -f $PREFIX/bin/fieldmap_dump
          - test -f $PREFIX/bin/generate_constant_fieldmap
          - test -f $PREFIX/bin/fairship_to_fieldmap
          - test -f $PREFIX/bin/plot_field_map
          # Round trip through the installed binaries: catches a tool that
          # resolves the wrong libSHiPFieldService at run time.
          - generate_constant_fieldmap smoke.root smoke 0 1 0 -1 1 -1 1 -1 1
          - fieldmap_dump smoke.root

  - package:
      name: field-service
    build:
      files: []
    requirements:
      run:
        - ${{ pin_subpackage('field-service-core', exact=True) }}
        - ${{ pin_subpackage('field-service-mapio', exact=True) }}
        - ${{ pin_subpackage('field-service-g4', exact=True) }}
        - ${{ pin_subpackage('field-service-tools', exact=True) }}

about:
  homepage: https://github.com/ShipSoft/field_service
  repository: https://github.com/ShipSoft/field_service
  summary: SHiP magnetic field service (framework-agnostic, covfie-backed)
  description: |
    SHiPFieldService is a framework-agnostic C++20 library exposing the
    SHiP magnetic field maps to simulation (aegir) and reconstruction.
    Maps are stored in the SHiP field-map format, a versioned ROOT
    RNTuple layout, and evaluated with the covfie library. The core
    library links neither Geant4 nor ROOT. Reading and writing map
    files is in the mapio sub-package, and an optional header-only
    Geant4 adapter (G4MagFieldAdapter) is shipped as a separate
    sub-package. The tools sub-package converts the legacy FairShip
    field-map format and inspects and plots maps.
  license: LGPL-3.0-or-later
  license_file: LICENSES/LGPL-3.0-or-later.txt

extra:
  recipe-maintainers:
    - olantwin
