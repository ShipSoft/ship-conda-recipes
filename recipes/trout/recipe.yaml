context:
  version: "0.2.0"

package:
  name: trout
  version: ${{ version }}

source:
  url: https://github.com/ShipSoft/Trout/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8697734e91c95de31de8e8d8ccbff66f15f8131745c63affab7551eee6326a47

build:
  number: 1
  skip:
    - win
  script: build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - sysroot_linux-64 2.17.*
    - cmake
    - make
  host:
    # 0.2.x still uses the camelCase field names that data-model 0.6
    # renamed, so it cannot build against 0.6.
    - shipdatamodel >=0.5,<0.6
    - shipgeometry
    - shipgeometryservice >=0.3
    # The placement helpers and the ACTS adapter first ship in 0.3.0;
    # 0.4 needs data-model 0.6.
    - field-service-core >=0.3,<0.4
    - field-service-mapio >=0.3,<0.4
    - field-service-acts >=0.3,<0.4
    - phlex >=0.4.1
    # SHiP::random::PhiloxRng, for make_test_input.
    - ship-random >=0.2
    # Upstream ACTS from conda-forge, not the acts-ship fork snapshot.
    - acts-core
    - root_base >=6.40
    # phlex/shipdatamodel are C++23; pin the matching ROOT variant so trout
    # and phlex stay co-installable (an unconstrained solve drifts down to
    # the C++20 ROOT build).
    - root_cxx_standard ==23
    # acts_geometry_provider compiles against Geant4 headers directly.
    - geant4
    # geant4 Config.cmake calls find_dependency() on all three; see
    # "Known upstream workarounds" in the README.
    - expat
    - zlib
    - freetype
    - random123
    - libboost-devel
    - tbb-devel
    - spdlog
    - fmt
    - mp-units
    - ms-gsl
    # GeoModel consumers need both in host — see "Known upstream
    # workarounds" in the README for the remove-when conditions.
    - eigen-abi-devel
    - nlohmann_json
  run_exports:
    - ${{ pin_subpackage('trout', upper_bound='x.x') }}

tests:
  - script:
      - test -f $PREFIX/lib/libread_digitised_hits.so
      - test -f $PREFIX/lib/libacts_geometry_provider.so
      - test -f $PREFIX/lib/libacts_field_provider.so
      - test -f $PREFIX/lib/libpassthrough.so
      - test -f $PREFIX/lib/libip_selector.so
      - test -f $PREFIX/lib/libspectrometer_tracking.so
      - test -f $PREFIX/lib/libupstream_tagger_reco.so
      - test -f $PREFIX/lib/libsurround_tagger_reco.so
      - test -f $PREFIX/lib/libcalorimeter_reco.so
      - test -f $PREFIX/lib/libtiming_detector_reco.so
      - test -f $PREFIX/lib/librec_output_module.so
      - test -d $PREFIX/share/trout/workflows

about:
  homepage: https://github.com/ShipSoft/Trout
  repository: https://github.com/ShipSoft/Trout
  summary: Phlex-based reconstruction framework for the SHiP experiment
  description: |
    Trout is the reconstruction package for the SHiP experiment, built on
    top of the Phlex parallel data-processing toolkit. It reads the
    digitised-hit output of the Shannon digitisation framework and provides
    ACTS-based spectrometer track finding and fitting, per-subdetector
    reconstruction modules, and RNTuple/histogram output.
  license: LGPL-3.0-or-later
  license_file:
    - LICENSES/LGPL-3.0-or-later.txt
    - LICENSES/MPL-2.0.txt

extra:
  recipe-maintainers:
    - olantwin
