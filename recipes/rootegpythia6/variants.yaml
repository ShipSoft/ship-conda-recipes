# Build against both ROOT C++ standard variants: cxx20 for consumers on
# the default ROOT builds (e.g. FairShip), cxx23 for the phlex/aegir
# stack (phlex pins root_cxx_standard ==23; genie inherits it).
root_cxx_standard:
  - "20"
  - "23"
# root_base is pinned deliberately — see "ROOT C++ standard variants" in the
# README. fairship and genie put rootegpythia6 in host: and pin root_base
# themselves, so this has to move in lockstep with theirs.
root_base:
  - "6.40.04"
