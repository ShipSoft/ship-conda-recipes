context:
  version: "0.1"
  # ShipSoft fork of luketpickering/ROOTEGPythia6, which has no releases.
  tag: "v6.28.0-ship1"

package:
  name: rootegpythia6
  version: ${{ version }}

source:
  url: https://github.com/ShipSoft/ROOTEGPythia6/archive/refs/tags/${{ tag }}.tar.gz
  sha256: 14b02629c503539ec6f60bd8f48cacc2161264ac0e4520c51932ada6b1dc9f04

build:
  number: 11
  script: build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - sysroot_linux-64 2.17.*
    - cmake
    - make
  host:
    # root_base is pinned by variants.yaml, not constrained here: a variant
    # value only substitutes into a dependency listed without a version.
    - root_base
    - root_cxx_standard
    - pythia6
  run_exports:
    - ${{ pin_subpackage('rootegpythia6', upper_bound='x.x') }}

tests:
  - script:
      - test -f $PREFIX/lib/libEGPythia6.so

about:
  homepage: https://github.com/ShipSoft/ROOTEGPythia6
  repository: https://github.com/ShipSoft/ROOTEGPythia6
  summary: Standalone ROOT EGPythia6 library (extracted from ROOT 6.28)
  description: |
    ROOTEGPythia6 packages the EGPythia6 library — ROOT's TGenerator
    interface to the Pythia6 event generator — as a standalone CMake
    project. The code was extracted from the ROOT 6.28 source tree
    after EGPythia6 was removed from ROOT itself in v6.30, allowing
    downstream experiments to keep using Pythia6 through the familiar
    TPythia6 interface.
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - olantwin
