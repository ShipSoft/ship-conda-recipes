context:
  # Ordinary shared libraries; the MODULE plugins keep .so on macOS.
  shlib_ext: ${{ "dylib" if osx else "so" }}
  version: "0.3.0"

package:
  name: shipgeometry
  version: ${{ version }}

source:
  url: https://github.com/ShipSoft/Geometry/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 35da251ad43852906f663dfcb8802ff8dc9b5a142916d01e1640af2d833d2252

build:
  number: 0
  skip:
    - win
  script: build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - if: linux
      then: sysroot_${{ target_platform }} 2.17.*
      else: ${{ stdlib('c') }}
    - cmake
    - make
  host:
    - geomodel-core
    - geomodel-tools
    - sqlite
    # 0.3.0 retyped the subsystem constants with mp-units quantities;
    # SHiPGeometryConfig.cmake find_dependency()s it, so consumers need it too
    # and its run_exports carry it to run.
    - mp-units
    # Logging in the executables only; PRIVATE to them, so build-time only.
    - spdlog
    # GeoModel consumers need both in host — see "Known upstream
    # workarounds" in the README for the remove-when conditions.
    - eigen-abi-devel
    - nlohmann_json
  run_exports:
    - ${{ pin_subpackage('shipgeometry', upper_bound='x.x') }}

tests:
  - script:
      # 0.3.0 renamed every library: the detector-assembly target is
      # ship_geometry and the subsystems are ship_geometry_<name>, so that a
      # source build does not put a target called Target or Magnet in the
      # consumer's global namespace.
      - test -f $PREFIX/lib/libship_geometry.${{ shlib_ext }}
      - test -f $PREFIX/lib/libship_geometry_cavern.${{ shlib_ext }}
      - test -f $PREFIX/lib/libship_geometry_target.${{ shlib_ext }}
      - test -f $PREFIX/lib/libship_geometry_muonshield.${{ shlib_ext }}
      - test -f $PREFIX/lib/libship_geometry_magnet.${{ shlib_ext }}
      - test -f $PREFIX/lib/libship_geometry_decayvolume.${{ shlib_ext }}
      - test -f $PREFIX/lib/libship_geometry_trackers.${{ shlib_ext }}
      - test -f $PREFIX/lib/libship_geometry_calorimeter.${{ shlib_ext }}
      - test -f $PREFIX/lib/libship_geometry_upstreamtagger.${{ shlib_ext }}
      - test -f $PREFIX/lib/libship_geometry_timingdetector.${{ shlib_ext }}
      - test -f $PREFIX/lib/libship_geometry_neutrinodetector.${{ shlib_ext }}
      - test -f $PREFIX/bin/build_geometry
      - test -f $PREFIX/bin/validate_geometry
      - test -f $PREFIX/lib/cmake/SHiPGeometry/SHiPGeometryConfig.cmake
      # The canonical header root, and the pre-0.3.0 forwarders that keep
      # existing consumers compiling until 0.4.0.
      - test -f $PREFIX/include/SHiP/geometry/DetectorBuilder.h
      - test -f $PREFIX/include/SHiP/geometry/Materials.h
      - test -f $PREFIX/include/SHiP/geometry/Cavern/CavernFactory.h
      - test -f $PREFIX/include/SHiPGeometry/SHiPGeometry.h
      - test -f $PREFIX/include/Cavern/CavernFactory.h
      # Exported target names, which no file test would notice regressing.
      - grep -q "SHiP::Geometry" $PREFIX/lib/cmake/SHiPGeometry/SHiPGeometryTargets.cmake
      - grep -q "SHiP::GeometryCavern" $PREFIX/lib/cmake/SHiPGeometry/SHiPGeometryTargets.cmake

about:
  homepage: https://github.com/ShipSoft/Geometry
  repository: https://github.com/ShipSoft/Geometry
  summary: SHiP detector description implemented in GeoModel
  description: |
    This package contains the SHiP experiment detector geometry
    implemented using the GeoModel toolkit. It provides the cavern,
    target, muon shield, magnet, decay volume, trackers, calorimeter,
    upstream tagger and timing detector subsystems as a set of
    libraries plus executables to build and validate the resulting
    GeoModel geometry database.
  license: LGPL-3.0-or-later
  license_file: LICENSES/LGPL-3.0-or-later.txt

extra:
  recipe-maintainers:
    - olantwin
