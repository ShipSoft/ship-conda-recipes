context:
  version: "0.5.0"

package:
  name: shipgeometryservice
  version: ${{ version }}

source:
  url: https://github.com/ShipSoft/geometry_service/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 6e42469d01f4fc9bc75a20a0449a70cbad35d5acd045ad57e16ddf5c86dfee2b

build:
  number: 0
  skip:
    - win
  script: build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - sysroot_linux-64 2.17.*
    - cmake
    - make
  host:
    - shipgeometry
    - geomodel-core
    - geomodel-g4
    - geant4
    # geant4 Config.cmake calls find_dependency() on all three; see
    # "Known upstream workarounds" in the README.
    - expat
    - zlib
    - freetype
    - mp-units
    # GeoModel consumers need both in host — see "Known upstream
    # workarounds" in the README for the remove-when conditions.
    - eigen-abi-devel
    - nlohmann_json
  run_exports:
    - ${{ pin_subpackage('shipgeometryservice', upper_bound='x.x') }}

tests:
  - script:
      - test -f $PREFIX/lib/libSHiPGeometryService.so
      - test -f $PREFIX/lib/cmake/SHiPGeometryService/SHiPGeometryServiceConfig.cmake
      - test -f $PREFIX/include/SHiP/GeometryService/GeometryService.h
      - test -f $PREFIX/include/SHiP/GeometryService/IGeometryService.h
      - test -f $PREFIX/include/SHiP/GeometryService/G4RayScanner.h
      - test -f $PREFIX/include/SHiP/GeometryService/GeometryThread.h
      - grep -q "SHiP::GeometryService" $PREFIX/lib/cmake/SHiPGeometryService/SHiPGeometryServiceTargets.cmake
      # Forwarders for the pre-0.5.0 paths, removed in 0.6.0.
      - test -f $PREFIX/include/GeometryService/SHiPGeometryService.h
      - test -f $PREFIX/include/GeometryService/IGeometryService.h
      - test -f $PREFIX/include/GeometryService/G4RayScanner.h
      - test -f $PREFIX/include/GeometryService/GeometryThread.h

about:
  homepage: https://github.com/ShipSoft/geometry_service
  repository: https://github.com/ShipSoft/geometry_service
  summary: Framework-agnostic C++20 service wrapping the SHiP GeoModel geometry
  description: |
    SHiPGeometryService is a framework-agnostic C++20 library that
    wraps the SHiP GeoModel geometry behind a stable, abstract
    interface (IGeometryService) inspired by DD4hep's IGeoSvc and
    ALICE O2's GeometryManager. It supports loading the geometry
    either from the SHiPGeometry builder or from a GeoModel SQLite
    file, and lazily converts it to Geant4 logical volumes on demand.
  license: LGPL-3.0-or-later
  license_file: LICENSES/LGPL-3.0-or-later.txt

extra:
  recipe-maintainers:
    - olantwin
