context:
  version: "26.09"

package:
  name: fairship
  version: ${{ version }}

source:
  url: https://github.com/ShipSoft/FairShip/archive/refs/tags/${{ version }}.tar.gz
  sha256: 7b0bae60777e426357a42186250594a00afcc80382760d1e5c1d85e1ffc9006c

build:
  number: 8
  script: build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - sysroot_linux-64 2.17.*
    - cmake
    - make
  host:
    - root_base
    - root_cxx_standard
    - geant4
    # geant4 Config.cmake calls find_dependency() on all three; see
    # "Known upstream workarounds" in the README.
    - expat
    - zlib
    - freetype
    - geant4-vmc
    - geant3
    - vmc
    - fairroot
    - faircmakemodules
    - fairlogger
    - genfit
    - rootegpythia6
    - pythia6
    - pythia8
    - evtgen
    - hepmc2
    - fmt
    - gsl
    - xerces-c
  run_exports:
    - ${{ pin_subpackage('fairship', upper_bound='x.x') }}

tests:
  - script:
      - test -f $PREFIX/lib/libShipData.so
      - test -d $PREFIX/include
      - test -d $PREFIX/share/FairShip/geometry
      # rattler-build's linking check runs against the host env, so a host dep
      # whose run_export never reaches the run env still packages green and
      # only fails when someone loads the library. That is how a fairship
      # without libEGPythia6.so shipped. The test env is the run env, so
      # resolve every NEEDED entry of the libraries this package installs.
      # Scoped to our own files through conda-meta: $PREFIX/lib also carries
      # other packages' optional plugins (pythia8's LHAPDF6 interface), which
      # are meant to dangle until their backend is installed.
      - |
        meta=$(ls "$PREFIX"/conda-meta/fairship-*.json)
        libs=$(grep -oE '"lib/lib[^"]*\.so[^"]*"' "$meta" | tr -d '"' | sort -u)
        # A silent pass here would be worse than a false alarm, so make an
        # empty or unreadable list fail rather than resolve nothing.
        test -n "$libs" || { echo "no libraries listed in $meta"; exit 1; }
        for lib in $libs; do
          test -f "$PREFIX/$lib" || { echo "listed but absent: $lib"; exit 1; }
          # ldd mid-pipeline would hide its own failure behind an empty grep,
          # so capture it first and check the status before the output.
          deps=$(ldd "$PREFIX/$lib") \
            || { echo "ldd could not inspect $lib"; exit 1; }
          unresolved=$(echo "$deps" | grep 'not found' || true)
          if [ -n "$unresolved" ]; then
            echo "unresolved runtime libraries in $lib:"
            echo "$unresolved"
            exit 1
          fi
        done

about:
  homepage: https://ship.web.cern.ch/
  repository: https://github.com/ShipSoft/FairShip
  summary: SHiP experiment software framework based on FairRoot
  description: |
    FairShip is the simulation, reconstruction and analysis framework
    for the SHiP (Search for Hidden Particles) experiment at CERN. It
    is built on top of FairRoot and provides the SHiP detector
    description, event generators, digitisation, reconstruction and
    analysis tools used by the collaboration.
  license: LGPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - olantwin
